name: ticket-deal

# All three services for Phase 0.
# Healthchecks are wired into `depends_on: condition: service_healthy`
# so anything depending on them waits until they're actually ready.

services:
  # ─── Hot path: token buckets, hold keys, atomic Lua scripts ───
  redis:
    image: redis:7-alpine
    container_name: ticket-redis
    ports:
      - "6379:6379"
    command: >
      redis-server
        --notify-keyspace-events Ex
        --appendonly yes
        --maxmemory 512mb
        --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s
    volumes:
      - redis-data:/data
    restart: unless-stopped

  # ─── System of record: events, reservations, idempotency ─────
  postgres:
    image: postgres:16-alpine
    container_name: ticket-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tickets}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tickets}
      POSTGRES_DB: ${POSTGRES_DB:-tickets}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tickets} -d ${POSTGRES_DB:-tickets}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  # ─── Async fulfilment queue (SQS-compatible) ──────────────────
  elasticmq:
    image: softwaremill/elasticmq:latest
    container_name: ticket-elasticmq
    ports:
      - "9324:9324"   # SQS-compatible REST API
      - "9325:9325"   # Web UI (queues + messages)
    volumes:
      # Mount our config at the path the image's default CMD already reads:
      #   java -Dconfig.file=/opt/elasticmq.conf -jar /opt/elasticmq/elasticmq-server.jar
      # No `command:` override needed.
      - ./docker/elasticmq.conf:/opt/elasticmq.conf:ro
    healthcheck:
      # Any HTTP response proves the port is listening; status code doesn't matter
      # (ElasticMQ returns 400 on bare GET /, but we only care about TCP being open)
      test: ["CMD-SHELL", "curl -s -o /dev/null http://127.0.0.1:9324/"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  # ─── Metrics aggregation ─────────────────────────────────────
  #
  # Scrapes the Go services (api, worker, expiration-watcher) on
  # the host machine via host.docker.internal — those services run
  # outside Docker via `make all-services`. /metrics endpoints:
  #   - API:      host.docker.internal:8080/metrics
  #   - Worker:   host.docker.internal:8081/metrics
  #   - Watcher:  host.docker.internal:8083/metrics
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: ticket-prometheus
    ports:
      - "9090:9090"   # Prometheus web UI
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
      - '--web.enable-lifecycle'  # POST /-/reload for hot config reload
    extra_hosts:
      - "host.docker.internal:host-gateway"  # macOS/Windows: alias to host
    restart: unless-stopped

  # ─── Dashboards & visualization ──────────────────────────────
  #
  # Auto-provisions the Prometheus datasource and dashboard JSONs
  # from /etc/grafana/provisioning and /var/lib/grafana/dashboards.
  # Default admin credentials: admin / admin123 (local dev only).
  grafana:
    image: grafana/grafana:11.3.0
    container_name: ticket-grafana
    ports:
      - "3000:3000"   # Grafana web UI
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin123
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"           # optional: no login required
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

  # ─── Distributed tracing storage & UI ───────────────────────
  #
  # Jaeger all-in-one image: accepts OTLP/gRPC on :4317 and OTLP/HTTP
  # on :4318, stores spans in-memory (or in a BadgerDB volume), and
  # serves the query UI on :16686. The Go services export spans via
  # OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317.
  #
  # All-in-one is fine for local dev; production would split collector
  # and storage (e.g. Jaeger collector + Elasticsearch / Kafka).
  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    container_name: ticket-jaeger
    ports:
      - "16686:16686"   # Jaeger UI
      - "4317:4317"     # OTLP gRPC (what OTel SDKs export to by default)
      - "4318:4318"     # OTLP HTTP (alternative)
      - "14268:14268"   # Jaeger native agent (legacy, unused)
    environment:
      # Use BadgerDB so spans survive container restarts (default = in-memory).
      SPAN_STORAGE_TYPE: badger
      # Retention: 2 days is plenty for dev. 168h = 7d for prod.
      BADGER_TTL: 48h
      # Sane sampling cap so a 1000-VU burst doesn't OOM the box.
      QUERY_MAX_LOOKBACK: 48h
    volumes:
      - jaeger-data:/badger
    restart: unless-stopped

  # ─── Log aggregation (Loki) ─────────────────────────────────
  #
  # Stores the Go service logs (slog → os.Stdout → logs/*.log on the
  # host → Promtail → here) and serves them via the Loki HTTP API.
  # Grafana queries Loki as a second datasource alongside Prometheus.
  #
  # Filesystem backend: zero extra services, but doesn't scale past
  # one box. Swap to S3/GCS + replication_factor=3 for prod.
  loki:
    image: grafana/loki:3.3.0
    container_name: ticket-loki
    ports:
      - "3100:3100"     # Loki HTTP API (push + query)
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped

  # ─── Log shipper (Promtail) ─────────────────────────────────
  #
  # Tails the Go service log files written by `make all-services` and
  # ships them to Loki with `service` + `trace_id` + `level` labels
  # extracted via regex pipeline stages.
  #
  # The bind mount `./logs:/var/log/ticket-deal:ro` reads from the
  # host's `logs/` dir (relative to this docker-compose.yml). Each
  # `api.log`, `worker.log`, etc. becomes its own service label.
  promtail:
    image: grafana/promtail:3.3.0
    container_name: ticket-promtail
    ports:
      - "9080:9080"     # Promtail's own /metrics (not directly used yet)
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - ./logs:/var/log/ticket-deal:ro   # host's logs/ dir, read-only
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    restart: unless-stopped

# Named volumes so data survives `docker compose down`
volumes:
  redis-data:
  postgres-data:
  prometheus-data:
  grafana-data:
  jaeger-data:
  loki-data:
