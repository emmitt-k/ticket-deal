# Grafana Promtail configuration for the ticket-deal local dev stack.
#
# Promtail's job is to tail log files, parse them, attach labels, and
# push them to Loki. We run it inside the docker-compose network so it
# can reach `loki:3100`, and we bind-mount the host's `logs/` directory
# at /var/log/ticket-deal so it can tail the Go service logs.
#
# Why one scrape_config per file:
#   Promtail consumes the `__path__` label during file discovery, so
#   relabel_configs can't see the expanded file path. The cleanest way
#   to set per-file labels (like `service=api`) is to declare a
#   separate scrape_config per file, each with its own `static_configs`
#   pointing at a single path and a hardcoded `service` label.
#
# Pipeline overview (per log line):
#   1. `service` and `job` are set per-target (so each file is a
#      different stream — no per-stream rate limit collisions).
#   2. pipeline_stages extract `level` (DEBUG/INFO/WARN/ERROR) from
#      the body. Both text and json formats are supported.
#   3. We deliberately do NOT extract trace_id as a label: it's
#      high-cardinality and would blow through Loki's active-stream
#      cap. trace_id is searched via line-filter `|=` in queries.

server:
  http_listen_port: 9080
  log_level: info

# Where to push logs. In docker-compose the service name resolves;
# from the host, point to localhost:3100.
clients:
  - url: http://loki:3100/loki/api/v1/push
    batchwait: 1s
    batchsize: 1048576   # 1 MB; cap per push batch
    backoff_config:
      min_period: 500ms
      max_period: 5m

# Where to remember which bytes we've already read in each file.
positions:
  filename: /tmp/positions.yaml

# A tiny helper template we re-use in every scrape job below.
# Each block sets service=<name> + job=ticket-deal, then runs the
# level-extraction pipeline_stages.
#
# NOTE: we use `service_name` (Promtail's default label) as our
# service identifier, so we don't have to also set `service`. This
# keeps the stream fingerprint clean: just {job, service_name, level}.
scrape_configs:
  - job_name: ticket-deal
    static_configs:
      - targets: [localhost]
        labels:
          job: ticket-deal
          service_name: api
          __path__: /var/log/ticket-deal/api.log

      - targets: [localhost]
        labels:
          job: ticket-deal
          service_name: worker
          __path__: /var/log/ticket-deal/worker.log

      - targets: [localhost]
        labels:
          job: ticket-deal
          service_name: expiration-watcher
          __path__: /var/log/ticket-deal/expiration-watcher.log

      - targets: [localhost]
        labels:
          job: ticket-deal
          service_name: dashboard-server
          __path__: /var/log/ticket-deal/dashboard-server.log

    # Line-level pipeline: extract `level` from the body. Both text
    # and json formats are supported. Each match block runs on every
    # line and only sets the label if the regex matches.
    pipeline_stages:
      - match:
          selector: '{job="ticket-deal"}'
          stages:
            # text format: level=ERROR
            - regex:
                expression: '(?:^|\s)level=(?P<lvl>DEBUG|INFO|WARN|ERROR)\b'
            - labels:
                level:

      - match:
          selector: '{job="ticket-deal"}'
          stages:
            # json format: "level":"ERROR"
            - regex:
                expression: '"level"\s*:\s*"(?P<lvl>DEBUG|INFO|WARN|ERROR)"'
            - labels:
                level:
