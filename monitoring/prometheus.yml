# Prometheus scrape config for ticket-deal.
#
# All services (Go + infra) now run on the same Docker user-defined network
# as part of `docker compose up`. Prometheus reaches the Go services by
# their compose service names (api:8080, worker:8081, expiration-watcher:8083)
# — no host.docker.internal needed anymore because nothing runs on the host.
#
# Scrape interval: 5s — fine enough to see load-test bursts as smooth
# graphs without overwhelming the metrics endpoints.

global:
  scrape_interval: 5s
  evaluation_interval: 5s
  external_labels:
    cluster: ticket-deal-local
    env: dev

scrape_configs:
  # API server — request rate, latency, reservation outcomes.
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets:
          - api:8080
        labels:
          service: api

  # Worker — SQS throughput, DB write latency, expiry sweep.
  - job_name: worker
    metrics_path: /metrics
    static_configs:
      - targets:
          - worker:8081
        labels:
          service: worker

  # Expiration-watcher — event-driven compensation rate.
  - job_name: expiration-watcher
    metrics_path: /metrics
    static_configs:
      - targets:
          - expiration-watcher:8083
        labels:
          service: expiration-watcher

  # Prometheus itself — useful for debugging scrape health.
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
