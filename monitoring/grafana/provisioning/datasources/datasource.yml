# Auto-provision the Prometheus + Loki datasources on Grafana startup.
# See https://grafana.com/docs/grafana/latest/administration/provisioning/#data-sources
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 5s
      httpMethod: POST

  # Loki serves the Go service logs (api, worker, watcher, dashboard).
  # Promtail (in docker-compose) tails the host's `logs/*.log` and
  # pushes labeled streams to Loki. Logs are searchable in Grafana →
  # Explore → datasource "Loki", or in the "Ticket Deal — Logs"
  # dashboard. Each stream has labels: service, trace_id, level.
  # The default `derivedField` lets users click a trace_id in a log
  # line to jump to Jaeger.
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      maxLines: 1000
      timeout: 60
      # Click a trace_id in a log line → open Jaeger with that trace.
      derivedFields:
        - name: trace_id
          matcherRegex: '"?(trace_id)"?\s*[:=]\s*"?([0-9a-f]{32})"?'  # text + json
          url: 'http://localhost:16686/trace/$${2}'
          datasourceUid: '__jaeger__'  # not a real datasource; we just want a link
      # Link logs → metrics by service name (auto-suggest "service" var).
      queryLanguage: logql
