# ElasticMQ local config — pre-creates queues on boot.
# Mounted into the container so the SQS API matches Phase 5+ worker expectations
# without anyone having to run `aws --endpoint-url=... sqs create-queue` manually.
#
# Reference: https://github.com/softwaremill/elasticmq#rest-interface

include classpath("application.conf")

queues {
  reservations {
    defaultVisibilityTimeout = 30 seconds
    receiveMessageWait       = 20 seconds
    delay                    = 0 seconds
    # type explicitly omitted → defaults to "standard" (unlimited throughput)
    # maxReceiveCount is for DLQ; we don't have a DLQ in Phase 0
  }
}
