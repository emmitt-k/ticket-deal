# ElasticMQ local config — pre-creates queues on boot.
# Mounted into the container so the SQS API matches Phase 5+ worker expectations
# without anyone having to run `aws --endpoint-url=... sqs create-queue` manually.
#
# Reference: https://github.com/softwaremill/elasticmq#rest-interface

include classpath("application.conf")

queues {
  reservations {
    defaultVisibilityTimeout = 30 seconds
    receiveMessageWait       = 20 seconds
    delay                    = 0 seconds
    # type explicitly omitted → defaults to "standard" (unlimited throughput)
    # maxReceiveCount is for DLQ; we don't have a DLQ in Phase 0
  }

  # The Stripe webhook events queue (Layer 2, item 7).
  #
  # A SEPARATE queue from `reservations`, deliberately: the two carry
  # unrelated message types, and a queue that mixes them forces a type
  # switch in the consumer. Three queues, three concerns — and when
  # item 8 adds `reservations-notifications`, the pattern already
  # holds.
  #
  # The API's webhook handler publishes here; cmd/stripe-worker
  # consumes it.
  stripe-events {
    defaultVisibilityTimeout = 30 seconds
    receiveMessageWait       = 20 seconds
    delay                    = 0 seconds
  }
}
